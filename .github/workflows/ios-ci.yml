name: iOS CI

on:
  push:
    branches: [ main, improv/npu ]
  pull_request:
    branches: [ main, improv/npu ]

jobs:
  lint:
    name: Linting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install SwiftLint
        run: brew install swiftlint
        
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Test Coverage
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build llama.xcframework (Simulator Only)
        run: |
          cd llama.cpp
          mkdir -p build-ios-sim
          cmake -B build-ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DGGML_METAL=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -S .
          cmake --build build-ios-sim --config Release -- -quiet
          
          # Setup minimal framework structure for xcodebuild -create-xcframework
          mkdir -p build-ios-sim/framework/llama.framework/Headers
          mkdir -p build-ios-sim/framework/llama.framework/Modules
          
          cp include/llama.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml-alloc.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml-backend.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml-metal.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml-cpu.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/ggml-blas.h build-ios-sim/framework/llama.framework/Headers/
          cp ggml/include/gguf.h build-ios-sim/framework/llama.framework/Headers/
          
          cat > build-ios-sim/framework/llama.framework/Modules/module.modulemap << EOF
          framework module llama {
              header "llama.h"
              header "ggml.h"
              header "ggml-alloc.h"
              header "ggml-backend.h"
              header "ggml-metal.h"
              header "ggml-cpu.h"
              header "ggml-blas.h"
              header "gguf.h"
              export *
          }
          EOF
          
          # Combine static libs into a dynamic one for the framework
          # We use find to locate the libraries to be robust against path variations
          LIB_LLAMA=$(find build-ios-sim -name libllama.a | grep Release | head -n 1)
          LIB_GGML=$(find build-ios-sim -name libggml.a | grep Release | head -n 1)
          LIB_GGML_BASE=$(find build-ios-sim -name libggml-base.a | grep Release | head -n 1)
          LIB_GGML_CPU=$(find build-ios-sim -name libggml-cpu.a | grep Release | head -n 1)
          LIB_GGML_METAL=$(find build-ios-sim -name libggml-metal.a | grep Release | head -n 1)
          LIB_GGML_BLAS=$(find build-ios-sim -name libggml-blas.a | grep Release | head -n 1)

          echo "Resolved library paths:"
          echo "LLAMA: $LIB_LLAMA"
          echo "GGML: $LIB_GGML"
          echo "GGML_BASE: $LIB_GGML_BASE"
          echo "GGML_CPU: $LIB_GGML_CPU"
          echo "GGML_METAL: $LIB_GGML_METAL"
          echo "GGML_BLAS: $LIB_GGML_BLAS"

          xcrun -sdk iphonesimulator clang++ -dynamiclib \
            -isysroot $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -arch arm64 -arch x86_64 \
            -mios-simulator-version-min=17.0 \
            -Wl,-force_load,"$LIB_LLAMA" \
            -Wl,-force_load,"$LIB_GGML" \
            -Wl,-force_load,"$LIB_GGML_BASE" \
            -Wl,-force_load,"$LIB_GGML_CPU" \
            -Wl,-force_load,"$LIB_GGML_METAL" \
            -Wl,-force_load,"$LIB_GGML_BLAS" \
            -framework Foundation -framework Metal -framework Accelerate \
            -install_name @rpath/llama.framework/llama \
            -o build-ios-sim/framework/llama.framework/llama
            
          # Create the xcframework at the path expected by the project
          mkdir -p build-apple
          xcrun xcodebuild -create-xcframework \
            -framework build-ios-sim/framework/llama.framework \
            -output build-apple/llama.xcframework

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project NeuraLink.xcodeproj \
            -scheme NeuraLink \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath ./build-ci \
            CODE_SIGNING_ALLOWED=NO

      - name: Pre-boot Simulator
        run: |
          # Ensure a clean slate
          xcrun simctl shutdown all || true
          xcrun simctl erase "iPhone 16e" || true
          xcrun simctl boot "iPhone 16e" || true
          xcrun simctl bootstatus "iPhone 16e" -b

      - name: Test Without Building
        run: |
          xcodebuild test-without-building \
            -project NeuraLink.xcodeproj \
            -scheme NeuraLink \
            -destination 'platform=iOS Simulator,name=iPhone 16e' \
            -derivedDataPath ./build-ci \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO
